spring:
  application:
    name: "E Commerce Application"

  datasource:  # MySQL connection
    url: jdbc:mysql://localhost:3306/ecommerceapp_db
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver  # JDBC driver

  jpa:  # JPA & Hibernate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true  # Optional: Logging SQL with formatting

  devtools:
    livereload:
      enabled: true

jwt:
  secret: myVeryLongSecretKeyForJwtTokenGeneration123456789
  expiration: 3600000